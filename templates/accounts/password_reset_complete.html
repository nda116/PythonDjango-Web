{% extends "base.html" %}

{% block title %}Password reset complete{% endblock %}

{% block content %}
  <section class="card col-lg-6 mx-auto">
    <div class="card-body">
      <h1>Password reset complete</h1>
      <div class="alert alert-success" role="alert">
        Your password has been changed successfully.
      </div>
      <a class="btn btn-primary" href="{% url 'accounts:login' %}">
        Log in
      </a>
    </div>
  </section>
{% endblock %}
