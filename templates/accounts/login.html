{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <section class="card col-lg-6 mx-auto">
    <div class="card-body">
      <h1>Log in</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button class="btn btn-primary" type="submit">Log in</button>
      </form>
      <p class="mt-3 mb-0">Do not have an account? <a href="{% url 'accounts:register' %}">Register</a>.</p>
    </div>
  </section>
{% endblock %}
