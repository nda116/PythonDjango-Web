{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <section class="card col-lg-6 mx-auto">
    <div class="card-body">
      <h1>Register</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Create account</button>
      </form>
      <p class="mt-3 mb-0">Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
    </div>
  </section>
{% endblock %}
