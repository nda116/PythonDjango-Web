{% extends "base.html" %}

{% block title %}Delete book{% endblock %}

{% block content %}
  <section class="card col-lg-8 mx-auto">
    <div class="card-body">
      <h1>Delete book</h1>
      <p>Are you sure you want to delete “{{ book.title }}”?</p>
      <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Delete</button>
        <a class="btn btn-outline-secondary" href="{% url 'library:book-detail' book.pk %}">Cancel</a>
      </form>
    </div>
  </section>
{% endblock %}
