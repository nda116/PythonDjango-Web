{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}
  <section class="card col-lg-8 mx-auto">
    <div class="card-body">
      <h1>{{ heading }}</h1>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Save</button>
        {% if book %}
          <a class="btn btn-outline-secondary" href="{% url 'library:book-detail' book.pk %}">Cancel</a>
        {% else %}
          <a class="btn btn-outline-secondary" href="{% url 'library:book-list' %}">Cancel</a>
        {% endif %}
      </form>
    </div>
  </section>
{% endblock %}
