{% extends "base.html" %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}
  <article class="card mb-3">
    <div class="card-body">
      <h1 class="card-title">{{ book.title }}</h1>
      <p><strong>Author:</strong> {{ book.author }}</p>
      <p><strong>Publication year:</strong> {{ book.publication_year|default:"Not provided" }}</p>
      <div>{{ book.description|linebreaksbr }}</div>
    </div>
  </article>

  <div class="d-flex gap-2">
    <a class="btn btn-primary" href="{% url 'library:book-update' book.pk %}">Edit</a>
    <a class="btn btn-danger" href="{% url 'library:book-delete' book.pk %}">Delete</a>
    <a class="btn btn-outline-secondary" href="{% url 'library:book-list' %}">Back</a>
  </div>
{% endblock %}
